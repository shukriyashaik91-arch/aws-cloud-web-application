<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Check | AWS Cloud Web Application</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      background: #0D1117;
      color: #E6EDF3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .health-card {
      background: #161B22;
      border: 1px solid #30363D;
      border-radius: 12px;
      padding: 2.5rem 3rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .status-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      animation: pulse 2s infinite;
    }

    .status-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #2ECC71;
      margin-bottom: 0.5rem;
    }

    .status-subtitle {
      color: #8B949E;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .metrics {
      background: rgba(0,0,0,0.3);
      border: 1px solid #30363D;
      border-radius: 8px;
      padding: 1.25rem;
      text-align: left;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      padding: 0.3rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .metric-row:last-child { border-bottom: none; }

    .metric-key   { color: #8B949E; }
    .metric-value { color: #FF9900; font-weight: 600; }
    .metric-value.green { color: #2ECC71; }

    .back-link {
      display: inline-block;
      margin-top: 0.5rem;
      color: #FF9900;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.5rem 1.25rem;
      border: 1px solid rgba(255,153,0,0.3);
      border-radius: 6px;
      transition: all 0.2s;
    }

    .back-link:hover {
      background: rgba(255,153,0,0.1);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.05); opacity: 0.8; }
    }

    .timestamp {
      color: #6E7681;
      font-size: 0.8rem;
      margin-top: 1rem;
      font-family: monospace;
    }
  </style>
</head>
<body>

<div class="health-card">
  <div class="status-icon">&#x2705;</div>
  <h1 class="status-title">Application Status: Healthy</h1>
  <p class="status-subtitle">
    AWS Cloud Web Application is running normally.
  </p>

  <div class="metrics">
    <div class="metric-row">
      <span class="metric-key">status</span>
      <span class="metric-value green">healthy</span>
    </div>
    <div class="metric-row">
      <span class="metric-key">service</span>
      <span class="metric-value">InternshipAWS Portal</span>
    </div>
    <div class="metric-row">
      <span class="metric-key">web_server</span>
      <span class="metric-value">Nginx</span>
    </div>
    <div class="metric-row">
      <span class="metric-key">platform</span>
      <span class="metric-value">Amazon EC2 (t3.micro)</span>
    </div>
    <div class="metric-row">
      <span class="metric-key">os</span>
      <span class="metric-value">Ubuntu Server 22.04 LTS</span>
    </div>
    <div class="metric-row">
      <span class="metric-key">region</span>
      <span class="metric-value">AWS (see console)</span>
    </div>
    <div class="metric-row">
      <span class="metric-key">http_check</span>
      <span class="metric-value green">pass</span>
    </div>
    <div class="metric-row">
      <span class="metric-key">response_code</span>
      <span class="metric-value green">200</span>
    </div>
  </div>

  <!--
    SECURITY NOTE:
    This page intentionally does NOT display:
    - EC2 instance ID
    - AWS account ID
    - Private IP address
    - Any credentials or tokens
    These would be security risks if exposed publicly.
  -->

  <a class="back-link" href="index.html">&#8592; Back to Portal</a>

  <p class="timestamp" id="ts">Loading timestamp...</p>
</div>

<script>
  // Display current timestamp — no server information leaked
  var el = document.getElementById('ts');
  if (el) {
    el.textContent = 'Checked at: ' + new Date().toUTCString();
  }
</script>

</body>
</html>
